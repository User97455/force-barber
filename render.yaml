databases:
  - name: tg-barber-db
    plan: free
    databaseName: barbershop
    user: barber

services:
  - type: web
    name: tg-barber-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tg-barber-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: WEBAPP_URL
        value: https://force-barber.vercel.app
